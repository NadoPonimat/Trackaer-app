<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трекер</title>
<style>
  :root{
    --bg:#0E0708;
    --surface:#17090B;
    --surface-2:#1F0D10;
    --line:#3A1A1D;
    --accent:#E02826;
    --income:#3FA96B;
    --text:#F2E9E6;
    --muted:#9A7B7C;
    --radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.45;
    display:flex;flex-direction:column;overscroll-behavior:none;
  }

  header{
    padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
    border-bottom:1px solid var(--line);background:var(--surface);
  }
  .crumbs{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;min-height:19px}
  .crumbs button{background:none;border:none;padding:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
  .crumbs .sep{opacity:.5}
  .titlerow{display:flex;align-items:center;gap:8px}
  h1{margin:2px 0 0;font-size:24px;font-weight:650;letter-spacing:-.01em;flex:1}
  .total{font-size:13px;color:var(--muted);margin-top:4px}
  .total b{color:var(--text);font-weight:600}
  .total .in{color:var(--income)}
  .total .out{color:var(--accent)}

  .months{display:flex;align-items:center;gap:12px;margin-top:10px}
  .months button{
    background:var(--bg);border:1px solid var(--line);color:var(--text);
    width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer;line-height:1;
  }
  .months span{font-size:14px;flex:1;text-align:center}

  main{flex:1;overflow-y:auto;padding:8px 12px 96px}

  .row{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px;margin-bottom:8px;
  }
  .row:active{background:var(--surface-2)}
  .row .body{flex:1;min-width:0;cursor:pointer}
  .row .name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.done .name{color:var(--muted);text-decoration:line-through}
  .row .meta{display:block;font-size:12px;color:var(--muted);margin-top:3px}
  .late{color:var(--accent)}
  .chev{color:var(--muted);font-size:20px;line-height:1}
  .sum{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .sum.in{color:var(--income)}
  .sum.out{color:var(--text)}

  .check{
    width:26px;height:26px;flex:none;border-radius:7px;
    border:1.5px solid var(--line);background:var(--bg);
    color:var(--accent);font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .check[aria-pressed="true"]{border-color:var(--accent)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin:0 9px}
  .dot.money{background:var(--income)}

  .bar{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}

  .plus{
    background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:8px;width:34px;height:34px;font-size:18px;flex:none;cursor:pointer;
  }
  .more{background:none;border:none;color:var(--muted);font-size:20px;padding:4px 6px;cursor:pointer;line-height:1}

  .empty{text-align:center;color:var(--muted);padding:56px 24px;font-size:15px}

  .fab{
    position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 22px);
    height:56px;padding:0 22px;border:none;border-radius:28px;
    background:var(--accent);color:#fff;font:inherit;font-size:16px;font-weight:600;
    box-shadow:0 6px 20px rgba(224,40,38,.35);cursor:pointer;
  }
  .fab:active{transform:translateY(1px)}

  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:20}
  .sheet-bg.open{display:flex}
  .sheet{
    width:100%;max-height:92vh;overflow-y:auto;background:var(--surface);
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    padding:20px 16px calc(env(safe-area-inset-bottom) + 20px);
  }
  .sheet h2{margin:0 0 14px;font-size:17px;font-weight:600}
  .sheet h3{margin:16px 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px}
  .field{margin-bottom:12px}
  .two{display:flex;gap:10px}
  .two .field{flex:1}
  input{
    width:100%;padding:13px 12px;background:var(--bg);color:var(--text);
    border:1px solid var(--line);border-radius:var(--radius);font:inherit;
  }
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .hint{font-size:12px;color:var(--muted);margin-top:5px}
  textarea{
    width:100%;min-height:120px;resize:vertical;padding:13px 12px;
    background:var(--bg);color:var(--text);border:1px solid var(--line);
    border-radius:var(--radius);font:inherit;line-height:1.5;
  }
  textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .board{
    width:100%;max-width:340px;margin:0 auto 12px;
    display:grid;grid-template-columns:repeat(8,1fr);
    border:1px solid var(--line);border-radius:8px;overflow:hidden;
  }
  .board .sq{position:relative}
  .board .sq::before{content:"";display:block;padding-top:100%}
  .board .light{background:#E3D3C6}
  .board .dark{background:#7E4340}
  .board svg{position:absolute;inset:6%;width:88%;height:88%}
  .board svg.w{fill:#FFFFFF;stroke:#12090A;stroke-width:1.6;stroke-linejoin:round}
  .board svg.b{fill:#12090A;stroke:#E3D3C6;stroke-width:1.2;stroke-linejoin:round}
  .note{
    background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;margin-bottom:12px;font-size:14px;color:var(--text);
    white-space:pre-wrap;max-height:40vh;overflow-y:auto;
  }
  .seg{display:flex;gap:8px;margin-bottom:14px}
  .seg button{
    flex:1;padding:12px;border-radius:var(--radius);background:var(--bg);
    color:var(--muted);border:1px solid var(--line);font:inherit;cursor:pointer;
  }
  .seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--text)}
  .picker{
    width:100%;padding:13px 12px;text-align:left;background:var(--bg);color:var(--text);
    border:1px solid var(--line);border-radius:var(--radius);font:inherit;cursor:pointer;
  }
  .actions{display:flex;gap:8px;margin-top:4px}
  .actions button{
    flex:1;padding:14px;border-radius:var(--radius);font:inherit;font-weight:600;
    border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;
  }
  .actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .menu button{
    display:block;width:100%;text-align:left;padding:15px 12px;margin-bottom:8px;
    background:var(--bg);color:var(--text);border:1px solid var(--line);
    border-radius:var(--radius);font:inherit;cursor:pointer;
  }
  .menu button.danger{color:var(--accent)}

  .pick{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:13px 12px;margin-bottom:8px;background:var(--bg);color:var(--text);
    border:1px solid var(--line);border-radius:var(--radius);font:inherit;cursor:pointer;
  }
  .pick[aria-pressed="true"]{border-color:var(--accent)}
  .pick .where{display:block;font-size:12px;color:var(--muted)}
  .pick .mark{color:var(--accent);flex:none}
  .pick .x{margin-left:auto;color:var(--muted);flex:none}
  .scroll{max-height:52vh;overflow-y:auto;margin-bottom:12px}

  .toast{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 92px);
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:11px 16px;border-radius:var(--radius);font-size:14px;
    opacity:0;pointer-events:none;transition:opacity .18s;z-index:30;
  }
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="titlerow">
    <h1 id="title">Трекер</h1>
    <button class="more" id="service" aria-label="Сервис">⋯</button>
  </div>
  <div class="total" id="total"></div>
  <div class="months" id="months" style="display:none">
    <button id="prevMonth" aria-label="Предыдущий месяц">‹</button>
    <span id="monthLabel"></span>
    <button id="nextMonth" aria-label="Следующий месяц">›</button>
  </div>
</header>

<main id="list"></main>

<button class="fab" id="add">Добавить</button>

<div class="sheet-bg" id="editBg">
  <div class="sheet">
    <h2 id="editTitle">Новое</h2>

    <div class="seg" id="kinds">
      <button data-kind="category" aria-pressed="true">Категория</button>
      <button data-kind="entry" aria-pressed="false">Запись</button>
    </div>

    <div class="field">
      <label for="fName">Название</label>
      <input id="fName" autocomplete="off">
    </div>

    <div id="catFields">
      <div id="modeWrap">
        <label>Тип категории</label>
        <div class="seg" id="modes">
          <button data-mode="plain" aria-pressed="true">Обычная</button>
          <button data-mode="money" aria-pressed="false">Финансовая</button>
        </div>
      </div>
      <div class="field" id="unitWrap">
        <label for="fUnit">Единица измерения</label>
        <input id="fUnit" autocomplete="off" placeholder="повторы, часы, партии">
        <div class="hint" id="unitHint"></div>
      </div>
      <div class="field" id="targetWrap">
        <label>Связи ведут в</label>
        <button class="picker" id="fTarget">Не выбрано</button>
        <div class="hint">Дебюты ведут в миттельшпили, миттельшпили — в эндшпили</div>
      </div>
    </div>

    <div id="entryFields">
      <div class="two">
        <div class="field">
          <label for="fPlan">План</label>
          <input id="fPlan" type="number" inputmode="decimal">
        </div>
        <div class="field">
          <label for="fFact">Факт</label>
          <input id="fFact" type="number" inputmode="decimal">
        </div>
      </div>
      <div class="field">
        <label for="fDeadline">Дедлайн</label>
        <input id="fDeadline" type="date">
      </div>
      <div class="field">
        <label for="fUnitOwn">Своя единица</label>
        <input id="fUnitOwn" autocomplete="off">
        <div class="hint" id="unitOwnHint"></div>
      </div>
    </div>

    <div id="moneyFields">
      <div class="seg" id="dirs">
        <button data-dir="-1" aria-pressed="true">Расход</button>
        <button data-dir="1" aria-pressed="false">Доход</button>
      </div>
      <div class="two">
        <div class="field">
          <label for="fAmount">Сумма</label>
          <input id="fAmount" type="number" inputmode="decimal">
        </div>
        <div class="field">
          <label for="fDate">Дата</label>
          <input id="fDate" type="date">
        </div>
      </div>
    </div>

    <div class="field" id="fenWrap">
      <label for="fFen">Позиция (FEN)</label>
      <input id="fFen" autocomplete="off" spellcheck="false"
             placeholder="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR">
      <div class="hint">Строка позиции из любой шахматной программы. Доска нарисуется сама.</div>
      <div id="fenPreview"></div>
    </div>

    <div class="field">
      <label for="fNote">Заметка</label>
      <textarea id="fNote" placeholder="Идея, планы сторон, типовые ходы"></textarea>
    </div>

    <div class="actions">
      <button id="editCancel">Отмена</button>
      <button id="editSave" class="primary">Сохранить</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="quickBg">
  <div class="sheet">
    <h2 id="quickTitle"></h2>
    <div class="field">
      <label for="fQuick">Сколько добавить к факту</label>
      <input id="fQuick" type="number" inputmode="decimal">
      <div class="hint" id="quickHint"></div>
    </div>
    <div class="actions">
      <button id="quickCancel">Отмена</button>
      <button id="quickSave" class="primary">Добавить</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="menuBg">
  <div class="sheet menu">
    <h2 id="menuTitle"></h2>
    <div id="menuBoard"></div>
    <div class="note" id="menuNote" style="display:none"></div>
    <button id="menuLinks">Связи</button>
    <button id="menuEdit">Изменить</button>
    <button id="menuDelete" class="danger">Удалить</button>
    <div class="actions"><button id="menuCancel">Отмена</button></div>
  </div>
</div>

<!-- связи выбранной записи -->
<div class="sheet-bg" id="linkBg">
  <div class="sheet">
    <h2 id="linkTitle"></h2>
    <h3>Ведёт к</h3>
    <div id="linkOut"></div>
    <h3>Приходит из</h3>
    <div id="linkIn"></div>
    <div class="actions">
      <button id="linkClose">Закрыть</button>
      <button id="linkAdd" class="primary">Добавить связь</button>
    </div>
  </div>
</div>

<!-- выбор: цель связи или целевая категория -->
<div class="sheet-bg" id="pickBg">
  <div class="sheet">
    <h2 id="pickTitle">Выбрать</h2>
    <div class="field"><input id="pickSearch" placeholder="Поиск" autocomplete="off"></div>
    <div class="scroll" id="pickList"></div>
    <div class="actions"><button id="pickClose">Готово</button></div>
  </div>
</div>

<div class="sheet-bg" id="serviceBg">
  <div class="sheet menu">
    <h2>Сервис</h2>
    <button id="seedChess">Загрузить шахматную базу</button>
    <button id="fillTheory">Дополнить дебюты теорией</button>
    <button id="fillSicilian">Сицилианская: разобрать по линиям</button>
    <div class="hint" id="seedHint">104 дебюта, 44 типовые структуры, 44 типа эндшпилей и связи между ними. Всё добавится в текущую категорию.</div>
    <div class="actions"><button id="serviceClose">Закрыть</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   Хранилище: на телефоне SQLite, в браузере localStorage.
====================================================================== */
const DB = 'tracker';

const CREATE = `
CREATE TABLE IF NOT EXISTS node (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  parent_id INTEGER,
  name TEXT NOT NULL,
  kind TEXT NOT NULL DEFAULT 'category',
  mode TEXT,
  unit TEXT,
  plan REAL,
  fact REAL,
  deadline TEXT,
  done INTEGER NOT NULL DEFAULT 0,
  amount REAL,
  op_date TEXT,
  direction INTEGER,
  target_id INTEGER,
  note TEXT,
  fen TEXT,
  sort INTEGER NOT NULL DEFAULT 0,
  created_at TEXT NOT NULL
);
CREATE INDEX IF NOT EXISTS idx_node_parent ON node(parent_id);
CREATE TABLE IF NOT EXISTS link (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  from_id INTEGER NOT NULL,
  to_id INTEGER NOT NULL,
  kind TEXT NOT NULL DEFAULT 'leads_to'
);
CREATE INDEX IF NOT EXISTS idx_link_from ON link(from_id);
CREATE INDEX IF NOT EXISTS idx_link_to ON link(to_id);
`;

const NEW_COLUMNS = [
  "ALTER TABLE node ADD COLUMN unit TEXT",
  "ALTER TABLE node ADD COLUMN plan REAL",
  "ALTER TABLE node ADD COLUMN fact REAL",
  "ALTER TABLE node ADD COLUMN deadline TEXT",
  "ALTER TABLE node ADD COLUMN done INTEGER NOT NULL DEFAULT 0",
  "ALTER TABLE node ADD COLUMN mode TEXT",
  "ALTER TABLE node ADD COLUMN amount REAL",
  "ALTER TABLE node ADD COLUMN op_date TEXT",
  "ALTER TABLE node ADD COLUMN direction INTEGER",
  "ALTER TABLE node ADD COLUMN target_id INTEGER",
  "ALTER TABLE node ADD COLUMN note TEXT",
  "ALTER TABLE node ADD COLUMN fen TEXT"
];

const FIELDS = ['parent_id','name','kind','mode','unit','plan','fact','deadline','done',
                'amount','op_date','direction','target_id','note','fen','sort','created_at'];

const SqliteRepo = {
  async init(){
    const S = window.Capacitor.Plugins.CapacitorSQLite;
    this.S = S;
    await S.createConnection({database:DB, version:1, encrypted:false,
                              mode:'no-encryption', readonly:false});
    await S.open({database:DB, readonly:false});
    await S.execute({database:DB, statements:CREATE, transaction:true});
    for(const sql of NEW_COLUMNS){
      try{ await S.execute({database:DB, statements:sql, transaction:false}); }
      catch(e){ /* колонка уже есть */ }
    }
  },
  async q(statement, values=[]){
    const r = await this.S.query({database:DB, statement, values});
    return r.values || [];
  },
  listChildren(parentId){
    return parentId === null
      ? this.q('SELECT * FROM node WHERE parent_id IS NULL ORDER BY sort, id')
      : this.q('SELECT * FROM node WHERE parent_id = ? ORDER BY sort, id', [parentId]);
  },
  listAll(){ return this.q('SELECT * FROM node'); },
  allLinks(){ return this.q('SELECT * FROM link'); },
  async insert(obj){
    const st = 'INSERT INTO node (' + FIELDS.join(',') + ') VALUES (' +
               FIELDS.map(() => '?').join(',') + ')';
    const r = await this.S.run({database:DB, statement:st,
                                values:FIELDS.map(f => obj[f] ?? null), transaction:true});
    return r.changes ? r.changes.lastId : null;
  },
  async update(id, patch){
    const keys = Object.keys(patch);
    if(!keys.length) return;
    const st = 'UPDATE node SET ' + keys.map(k => k + ' = ?').join(', ') + ' WHERE id = ?';
    await this.S.run({database:DB, statement:st,
                      values:[...keys.map(k => patch[k] ?? null), id], transaction:true});
  },
  async remove(id){
    await this.S.run({database:DB, statement:'DELETE FROM node WHERE id = ?', values:[id], transaction:true});
    await this.S.run({database:DB, statement:'DELETE FROM link WHERE from_id = ? OR to_id = ?',
                      values:[id, id], transaction:true});
  },
  async addLink(from, to){
    await this.S.run({database:DB,
      statement:'INSERT INTO link (from_id, to_id, kind) VALUES (?,?,?)',
      values:[from, to, 'leads_to'], transaction:true});
  },
  async removeLink(from, to){
    await this.S.run({database:DB,
      statement:'DELETE FROM link WHERE from_id = ? AND to_id = ?',
      values:[from, to], transaction:true});
  }
};

const MemoryRepo = {
  async init(){
    this.d = JSON.parse(localStorage.getItem(DB) || '{"node":[],"link":[],"seq":0}');
    if(!this.d.link) this.d.link = [];
  },
  save(){ localStorage.setItem(DB, JSON.stringify(this.d)); },
  async listChildren(parentId){
    return this.d.node.filter(n => n.parent_id === parentId)
                      .sort((a,b) => a.sort - b.sort || a.id - b.id);
  },
  async listAll(){ return this.d.node.slice(); },
  async allLinks(){ return this.d.link.slice(); },
  async insert(obj){
    const id = ++this.d.seq;
    const row = {id};
    FIELDS.forEach(f => row[f] = obj[f] ?? null);
    this.d.node.push(row); this.save(); return id;
  },
  async update(id, patch){
    const n = this.d.node.find(x => x.id === id);
    if(n) Object.assign(n, patch);
    this.save();
  },
  async remove(id){
    this.d.node = this.d.node.filter(x => x.id !== id);
    this.d.link = this.d.link.filter(l => l.from_id !== id && l.to_id !== id);
    this.save();
  },
  async addLink(from, to){
    this.d.link.push({from_id:from, to_id:to, kind:'leads_to'});
    this.save();
  },
  async removeLink(from, to){
    this.d.link = this.d.link.filter(l => !(l.from_id === from && l.to_id === to));
    this.save();
  }
};

let repo;

async function openDatabase(){
  const native = window.Capacitor && window.Capacitor.isNativePlatform
              && window.Capacitor.isNativePlatform();
  repo = native ? SqliteRepo : MemoryRepo;
  await repo.init();
  const roots = await repo.listChildren(null);
  if(roots.length === 0){
    await createNode(null, {name:'Развитие', kind:'category'});
    await createNode(null, {name:'Финансы',  kind:'category', mode:'money'});
  }
}

/* ------------------------------ данные ------------------------- */

function createNode(parentId, d){
  return repo.insert({
    parent_id:parentId, name:d.name, kind:d.kind,
    mode:d.mode ?? null, unit:d.unit ?? null,
    plan:d.plan ?? null, fact:d.fact ?? null, deadline:d.deadline ?? null, done:0,
    amount:d.amount ?? null, op_date:d.op_date ?? null, direction:d.direction ?? null,
    target_id:d.target_id ?? null, note:d.note ?? null, fen:d.fen ?? null,
    sort:Date.now(), created_at:new Date().toISOString()
  });
}

async function deleteNode(id){
  for(const kid of await repo.listChildren(id)) await deleteNode(kid.id);
  await repo.remove(id);
}

async function aggregate(id){
  let plan = 0, fact = 0, count = 0, done = 0;
  for(const kid of await repo.listChildren(id)){
    if(kid.kind === 'entry'){
      count++;
      if(kid.done) done++;
      if(!kid.unit){ plan += Number(kid.plan) || 0; fact += Number(kid.fact) || 0; }
    } else {
      const a = await aggregate(kid.id);
      plan += a.plan; fact += a.fact; count += a.count; done += a.done;
    }
  }
  return {plan, fact, count, done};
}

async function aggregateMoney(id, ym){
  let income = 0, expense = 0, count = 0;
  for(const kid of await repo.listChildren(id)){
    if(kid.kind === 'entry'){
      if(!kid.op_date || !kid.op_date.startsWith(ym)) continue;
      count++;
      const v = Number(kid.amount) || 0;
      if(Number(kid.direction) > 0) income += v; else expense += v;
    } else {
      const a = await aggregateMoney(kid.id, ym);
      income += a.income; expense += a.expense; count += a.count;
    }
  }
  return {income, expense, count};
}

/* индекс всех узлов: имя, путь, дети — для связей и выбора */
let index = {byId:new Map(), all:[], links:[]};

async function reindex(){
  const all = await repo.listAll();
  const byId = new Map(all.map(n => [n.id, n]));
  index = {byId, all, links: await repo.allLinks()};
}

function nodePath(node){
  const parts = [];
  let p = node.parent_id != null ? index.byId.get(node.parent_id) : null;
  while(p){ parts.unshift(p.name); p = p.parent_id != null ? index.byId.get(p.parent_id) : null; }
  return parts.join(' / ');
}

function descendantEntries(id){
  const out = [];
  const walk = pid => {
    for(const n of index.all){
      if(n.parent_id !== pid) continue;
      if(n.kind === 'entry') out.push(n); else walk(n.id);
    }
  };
  walk(id);
  return out;
}

const linksFrom = id => index.links.filter(l => l.from_id === id);
const linksTo   = id => index.links.filter(l => l.to_id === id);

/* ------------------------------ экран -------------------------- */

let path = [];
let month = new Date();

const current = () => path.length ? path[path.length-1].id : null;
const currentUnit = () => {
  for(let i = path.length - 1; i >= 0; i--) if(path[i].unit) return path[i].unit;
  return '';
};
const isMoney = () => path.some(p => p.mode === 'money');

const $ = id => document.getElementById(id);
const num = v => (v === null || v === undefined || v === '') ? null : Number(v);
const fmt = v => {
  const n = Number(v) || 0;
  return Number.isInteger(n) ? String(n) : n.toFixed(1).replace('.', ',');
};
const money = v => (Number(v) || 0).toLocaleString('ru-RU', {maximumFractionDigits:0});
const ymOf = d => d.toISOString().slice(0,7);
const today = () => new Date().toISOString().slice(0,10);
const MONTHS = ['январь','февраль','март','апрель','май','июнь',
                'июль','август','сентябрь','октябрь','ноябрь','декабрь'];

function toast(text){
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

function overdue(item){
  if(!item.deadline || item.done) return false;
  return item.deadline < today();
}

$('prevMonth').onclick = () => { month.setMonth(month.getMonth() - 1); render(); };
$('nextMonth').onclick = () => { month.setMonth(month.getMonth() + 1); render(); };

async function render(){
  await reindex();

  $('title').textContent = path.length ? path[path.length-1].name : 'Трекер';

  const crumbs = $('crumbs');
  crumbs.innerHTML = '';
  if(path.length){
    const home = document.createElement('button');
    home.textContent = 'Все разделы';
    home.onclick = () => { path = []; render(); };
    crumbs.appendChild(home);
    path.slice(0, -1).forEach((p, i) => {
      const sep = document.createElement('span');
      sep.className = 'sep'; sep.textContent = '/';
      crumbs.appendChild(sep);
      const b = document.createElement('button');
      b.textContent = p.name;
      b.onclick = () => { path = path.slice(0, i+1); render(); };
      crumbs.appendChild(b);
    });
  }

  const moneyView = isMoney();
  const ym = ymOf(month);
  $('months').style.display = moneyView ? 'flex' : 'none';
  $('monthLabel').textContent = MONTHS[month.getMonth()] + ' ' + month.getFullYear();

  const totalEl = $('total');
  totalEl.innerHTML = '';
  if(path.length && moneyView){
    const a = await aggregateMoney(current(), ym);
    if(a.count){
      const net = a.income - a.expense;
      totalEl.innerHTML =
        'Доход <b class="in">' + money(a.income) + '</b> · ' +
        'Расход <b class="out">' + money(a.expense) + '</b> · ' +
        'Итог <b>' + (net >= 0 ? '+' : '−') + money(Math.abs(net)) + '</b>';
    } else {
      totalEl.textContent = 'В этом месяце операций нет';
    }
  } else if(path.length){
    const a = await aggregate(current());
    const unit = currentUnit();
    if(a.count)
      totalEl.innerHTML =
        'Выполнено <b>' + a.done + '</b> из <b>' + a.count + '</b>' +
        (a.plan ? ' · <b>' + fmt(a.fact) + '</b> из <b>' + fmt(a.plan) + '</b>' +
                  (unit ? ' ' + unit : '') : '');
  }

  const list = $('list');
  list.innerHTML = '';
  let items = await repo.listChildren(current());

  if(moneyView)
    items = items.filter(n => n.kind === 'category' ||
                              (n.op_date && n.op_date.startsWith(ym)));

  if(items.length === 0){
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = moneyView
      ? 'За этот месяц записей нет.'
      : 'Пока пусто. Нажми «Добавить», чтобы создать первую категорию.';
    list.appendChild(e);
    return;
  }

  for(const item of items){
    const row = document.createElement('div');
    row.className = 'row' + (item.done ? ' done' : '');
    const itemMoney = moneyView || item.mode === 'money';

    if(item.kind === 'entry' && !itemMoney){
      const chk = document.createElement('button');
      chk.className = 'check';
      chk.setAttribute('aria-pressed', item.done ? 'true' : 'false');
      chk.setAttribute('aria-label', 'Выполнено: ' + item.name);
      chk.textContent = item.done ? '✓' : '';
      chk.onclick = async e => {
        e.stopPropagation();
        await repo.update(item.id, {done: item.done ? 0 : 1});
        render();
      };
      row.appendChild(chk);
    } else {
      const dot = document.createElement('span');
      dot.className = 'dot' + (item.mode === 'money' ? ' money' : '');
      row.appendChild(dot);
    }

    const body = document.createElement('div');
    body.className = 'body';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = item.name;
    body.appendChild(name);

    const meta = document.createElement('span');
    meta.className = 'meta';

    if(item.kind === 'category'){
      const kids = await repo.listChildren(item.id);
      const parts = [];
      if(itemMoney){
        const a = await aggregateMoney(item.id, ym);
        parts.push(a.count ? a.count + ' операций' : 'за месяц пусто');
        if(a.expense) parts.push('расход ' + money(a.expense));
        if(a.income)  parts.push('доход ' + money(a.income));
      } else {
        const a = await aggregate(item.id);
        const unit = item.unit || currentUnit();
        parts.push(kids.length === 0 ? 'пусто' : kids.length + ' внутри');
        if(a.count) parts.push(a.done + '/' + a.count + ' готово');
        if(a.plan)  parts.push(fmt(a.fact) + ' из ' + fmt(a.plan) + (unit ? ' ' + unit : ''));
      }
      meta.textContent = parts.join(' · ');
      body.appendChild(meta);
      body.onclick = () => {
        path.push({id:item.id, name:item.name, unit:item.unit, mode:item.mode});
        render();
      };
    } else if(itemMoney){
      meta.textContent = item.op_date ? item.op_date.split('-').reverse().join('.') : '';
      body.appendChild(meta);
      body.onclick = () => openMenu(item);
    } else {
      const unit = item.unit || currentUnit();
      const parts = [];
      if(item.plan !== null && item.plan !== undefined && item.plan !== '')
        parts.push(fmt(item.fact) + ' из ' + fmt(item.plan) + (unit ? ' ' + unit : ''));
      else if(item.fact)
        parts.push(fmt(item.fact) + (unit ? ' ' + unit : ''));
      if(item.deadline) parts.push('до ' + item.deadline.split('-').reverse().join('.'));
      const out = linksFrom(item.id).length, inc = linksTo(item.id).length;
      const kids = index.all.filter(n => n.parent_id === item.id).length;
      if(kids) parts.push(kids + ' линий');
      if(out) parts.push('ведёт к ' + out);
      if(inc) parts.push('из ' + inc);
      if(item.note) parts.push('есть заметка');
      meta.textContent = parts.join(' · ');
      if(overdue(item)) meta.classList.add('late');
      body.appendChild(meta);

      if(item.plan){
        const bar = document.createElement('div');
        bar.className = 'bar';
        const fill = document.createElement('i');
        fill.style.width =
          Math.min(100, Math.round((Number(item.fact) || 0) / Number(item.plan) * 100)) + '%';
        bar.appendChild(fill);
        body.appendChild(bar);
      }
      body.onclick = () => {
        if(index.all.some(n => n.parent_id === item.id)){
          path.push({id:item.id, name:item.name, unit:item.unit, mode:null});
          render();
        } else openMenu(item);
      };
    }
    row.appendChild(body);

    const hasKids = item.kind === 'entry' && index.all.some(n => n.parent_id === item.id);

    if(item.kind === 'category'){
      const chev = document.createElement('span');
      chev.className = 'chev';
      chev.textContent = '›';
      row.appendChild(chev);
    } else if(itemMoney){
      const sum = document.createElement('span');
      const income = Number(item.direction) > 0;
      sum.className = 'sum ' + (income ? 'in' : 'out');
      sum.textContent = (income ? '+' : '−') + money(item.amount);
      row.appendChild(sum);
    } else if(hasKids){
      const chev = document.createElement('span');
      chev.className = 'chev';
      chev.textContent = '›';
      row.appendChild(chev);
    } else {
      const plus = document.createElement('button');
      plus.className = 'plus';
      plus.textContent = '+';
      plus.setAttribute('aria-label', 'Добавить к факту: ' + item.name);
      plus.onclick = e => { e.stopPropagation(); openQuick(item); };
      row.appendChild(plus);
    }

    const more = document.createElement('button');
    more.className = 'more';
    more.textContent = '⋯';
    more.setAttribute('aria-label', 'Действия: ' + item.name);
    more.onclick = e => { e.stopPropagation(); openMenu(item); };
    row.appendChild(more);

    list.appendChild(row);
  }
}

let editState = {mode:'add', kind:'category', catMode:'plain', dir:-1, target:null, node:null};

function syncEditFields(){
  const cat = editState.kind === 'category';
  const inMoney = isMoney();
  const moneyEntry = !cat && (inMoney || (editState.node && editState.node.amount != null));

  $('catFields').style.display   = cat ? 'block' : 'none';
  $('entryFields').style.display = (!cat && !moneyEntry) ? 'block' : 'none';
  $('moneyFields').style.display = moneyEntry ? 'block' : 'none';
  $('fenWrap').style.display     = moneyEntry ? 'none' : 'block';

  const plainCat = cat && editState.catMode === 'plain' && !inMoney;
  $('modeWrap').style.display   = (cat && !inMoney) ? 'block' : 'none';
  $('unitWrap').style.display   = plainCat ? 'block' : 'none';
  $('targetWrap').style.display = plainCat ? 'block' : 'none';

  const t = editState.target != null ? index.byId.get(editState.target) : null;
  $('fTarget').textContent = t ? t.name : 'Не выбрано';

  [...$('kinds').children].forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.kind === editState.kind)));
  [...$('modes').children].forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.mode === editState.catMode)));
  [...$('dirs').children].forEach(b =>
    b.setAttribute('aria-pressed', String(Number(b.dataset.dir) === editState.dir)));
}

function openEditor(mode, node){
  editState = {
    mode,
    kind: node ? node.kind : 'category',
    catMode: node ? (node.mode === 'money' ? 'money' : 'plain') : (isMoney() ? 'money' : 'plain'),
    dir: node && Number(node.direction) > 0 ? 1 : -1,
    target: node ? (node.target_id ?? null) : null,
    node: node || null
  };
  $('editTitle').textContent = mode === 'add' ? 'Новое' : 'Изменить';
  $('kinds').style.display = mode === 'add' ? 'flex' : 'none';

  $('fName').value     = node ? node.name : '';
  $('fUnit').value     = node && node.kind === 'category' ? (node.unit || '') : '';
  $('fPlan').value     = node && node.plan != null ? node.plan : '';
  $('fFact').value     = node && node.fact != null ? node.fact : '';
  $('fDeadline').value = node && node.deadline ? node.deadline : '';
  $('fUnitOwn').value  = node && node.kind === 'entry' ? (node.unit || '') : '';
  $('fAmount').value   = node && node.amount != null ? node.amount : '';
  $('fDate').value     = node && node.op_date ? node.op_date : today();
  $('fNote').value     = node && node.note ? node.note : '';
  $('fFen').value      = node && node.fen ? node.fen : '';
  drawBoard($('fenPreview'), $('fFen').value);

  const inherited = currentUnit();
  $('unitHint').textContent = inherited
    ? 'Если оставить пустым, наследуется: ' + inherited
    : 'Наследуется всем, что внутри';
  $('unitOwnHint').textContent = inherited
    ? 'Пусто — считается в «' + inherited + '»'
    : 'У категории выше единица не задана';

  syncEditFields();
  $('editBg').classList.add('open');
  setTimeout(() => $('fName').focus(), 50);
}

function closeEditor(){ $('editBg').classList.remove('open'); }

[...$('kinds').children].forEach(b => {
  b.onclick = () => { editState.kind = b.dataset.kind; syncEditFields(); };
});
[...$('modes').children].forEach(b => {
  b.onclick = () => { editState.catMode = b.dataset.mode; syncEditFields(); };
});
[...$('dirs').children].forEach(b => {
  b.onclick = () => { editState.dir = Number(b.dataset.dir); syncEditFields(); };
});

$('fTarget').onclick = () => openPicker('target');

/* живой просмотр доски, пока печатаешь FEN */
$('fFen').addEventListener('input', () => drawBoard($('fenPreview'), $('fFen').value));

$('add').onclick = () => openEditor('add', null);
$('editCancel').onclick = closeEditor;

$('editSave').onclick = async () => {
  const name = $('fName').value.trim();
  if(!name){ toast('Введи название'); return; }

  const cat = editState.kind === 'category';
  const inMoney = isMoney();
  let data;

  if(cat){
    const isMoneyCat = inMoney || editState.catMode === 'money';
    data = {
      name, kind:'category',
      mode: isMoneyCat ? 'money' : null,
      unit: isMoneyCat ? null : ($('fUnit').value.trim() || null),
      target_id: isMoneyCat ? null : editState.target,
      note: $('fNote').value.trim() || null,
      fen: $('fFen').value.trim() || null,
      plan:null, fact:null, deadline:null, amount:null, op_date:null, direction:null
    };
  } else if(inMoney || (editState.node && editState.node.amount != null)){
    const amount = num($('fAmount').value);
    if(amount === null){ toast('Введи сумму'); return; }
    data = {
      name, kind:'entry', mode:null, unit:null, target_id:null,
      note: $('fNote').value.trim() || null,
      fen: $('fFen').value.trim() || null,
      plan:null, fact:null, deadline:null,
      amount: Math.abs(amount),
      op_date: $('fDate').value || today(),
      direction: editState.dir
    };
  } else {
    data = {
      name, kind:'entry', mode:null, target_id:null,
      note: $('fNote').value.trim() || null,
      fen: $('fFen').value.trim() || null,
      unit: $('fUnitOwn').value.trim() || null,
      plan: num($('fPlan').value),
      fact: num($('fFact').value),
      deadline: $('fDeadline').value || null,
      amount:null, op_date:null, direction:null
    };
  }

  if(editState.mode === 'add'){
    await createNode(current(), data);
    toast('Добавлено');
  } else {
    await repo.update(editState.node.id, data);
    const p = path.find(x => x.id === editState.node.id);
    if(p){ p.name = data.name; p.unit = data.unit; p.mode = data.mode; }
    toast('Сохранено');
  }
  closeEditor();
  render();
};

function renderLinks(){
  const out = $('linkOut'), inc = $('linkIn');
  out.innerHTML = ''; inc.innerHTML = '';

  const outs = linksFrom(linkNode.id);
  if(!outs.length) out.innerHTML = '<div class="hint">Пока никуда не ведёт</div>';
  outs.forEach(l => {
    const n = index.byId.get(l.to_id);
    if(!n) return;
    const b = document.createElement('button');
    b.className = 'pick';
    b.innerHTML = '<span><span>' + n.name +
                  '</span><span class="where">' + nodePath(n) + '</span></span>' +

      await repo.removeLink(linkNode.id, n.id);
      await reindex(); renderLinks(); render();
    };

  });

  if(!ins.length) inc.innerHTML = '<div class="hint">Сюда пока ничего не ведёт</div>';

    const n = index.byId.get(l.from_id);
    if(!n) return;
    const d = document.createElement('div');
    d.className = 'pick';
    d.innerHTML = '<span><span>' + n.name +
                  '</span><span class="where">' + nodePath(n) + '</span></span>';

}

/* ---------------------------- выбор ----------------------------- */

let pickMode = 'link';   // 'link' — цель связи, 'target' — целевая категория

function openPicker(mode){
  pickMode = mode;
  $('pickTitle').textContent = mode === 'link' ? 'Куда ведёт' : 'Целевая категория';
  $('pickSearch').value = '';
  renderPicker();
  $('pickBg').classList.add('open');
}
function closePicker(){ $('pickBg').classList.remove('open'); }

$('pickClose').onclick = closePicker;
$('pickSearch').addEventListener('input', renderPicker);

function pickCandidates(){
  const q = $('pickSearch').value.trim().toLowerCase();

  if(pickMode === 'target'){
    return index.all
      .filter(n => n.kind === 'category' && n.mode !== 'money' &&
                   (!editState.node || n.id !== editState.node.id))
      .filter(n => !q || n.name.toLowerCase().includes(q));
  }

  /* цель связи: сначала записи из целевой категории родителя */
  const parent = linkNode.parent_id != null ? index.byId.get(linkNode.parent_id) : null;
  let pool;
  if(parent && parent.target_id != null){
    pool = descendantEntries(parent.target_id);
    if(q) pool = pool.filter(n => n.name.toLowerCase().includes(q));
    if(!q || pool.length) return pool;
  }
  pool = index.all.filter(n => n.kind === 'entry' && n.id !== linkNode.id && n.amount == null);
  return q ? pool.filter(n => n.name.toLowerCase().includes(q)) : pool.slice(0, 50);
}

function renderPicker(){
  const list = $('pickList');
  list.innerHTML = '';
  const items = pickCandidates();

  if(!items.length){
    list.innerHTML = '<div class="hint">Ничего не найдено. ' +
      (pickMode === 'link'
        ? 'Проверь, задана ли у категории целевая, или ищи по названию.'
        : 'Сначала создай категорию.') + '</div>';
    return;
  }

  const linked = pickMode === 'link'
    ? new Set(linksFrom(linkNode.id).map(l => l.to_id))
    : new Set();

  for(const n of items){
    const b = document.createElement('button');
    b.className = 'pick';
    const on = pickMode === 'link'
      ? linked.has(n.id)
      : editState.target === n.id;
    b.setAttribute('aria-pressed', String(on));
    b.innerHTML = '<span class="mark">' + (on ? '✓' : '·') + '</span>' +
                  '<span><span>' + n.name +
                  '</span><span class="where">' + nodePath(n) + '</span></span>';
    b.onclick = async () => {
      if(pickMode === 'target'){
        editState.target = editState.target === n.id ? null : n.id;
        syncEditFields();
        closePicker();
      } else {
        if(linked.has(n.id)) await repo.removeLink(linkNode.id, n.id);
        else await repo.addLink(linkNode.id, n.id);
        await reindex();
        renderPicker();
        renderLinks();
      }
    };
    list.appendChild(b);
  }
}

/* Рисует позицию из FEN. Строку с ходами и правами рокировки тоже принимает. */
function drawBoard(host, fen, quiet){
  host.innerHTML = '';
  if(!fen || !String(fen).trim()) return;

  const field = String(fen).trim().split(/\s+/)[0];
  const rows = field.split('/');
  const cells = [];

  for(const row of rows){
    const line = [];
    for(const ch of row){
      if(/[1-8]/.test(ch)) for(let i = 0; i < Number(ch); i++) line.push(null);
      else if(/[kqrbnp]/i.test(ch)) line.push(ch);
      else { line.push(undefined); }
    }
    cells.push(line);
  }

  const ok = rows.length === 8 && cells.every(l => l.length === 8 && !l.includes(undefined));
  if(!ok){
    if(!quiet){
      const w = document.createElement('div');
      w.className = 'hint';
      w.textContent = 'Позиция не распознана. Нужна строка вида ' +
                      'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR';
      host.appendChild(w);
    }
    return;
  }

  let html = '';
  cells.forEach((line, r) => line.forEach((ch, c) => {
    const dark = (r + c) % 2 === 1;
    html += '<div class="sq ' + (dark ? 'dark' : 'light') + '">';
    if(ch){
      const white = ch === ch.toUpperCase();
      html += '<svg viewBox="0 0 45 45" class="' + (white ? 'w' : 'b') + '">' +
              PIECE[ch.toLowerCase()] + '</svg>';
    }
    html += '</div>';
  }));

  const board = document.createElement('div');
  board.className = 'board';
  board.innerHTML = html;
  host.appendChild(board);
}

  const endIds = new Map();
  const midIds = new Map();

  const catEnd = await createNode(root, {name:'Эндшпили', kind:'category', unit:'партии'});
  const catMid = await createNode(root, {name:'Миттельшпили', kind:'category',
                                         unit:'партии', target_id:catEnd});
  const catOpen = await createNode(root, {name:'Дебюты', kind:'category',
                                          unit:'партии', target_id:catMid});

  for(const [key, name] of END)
    endIds.set(key, await createNode(catEnd, {name, kind:'entry'}));

  for(const [key, name] of all)
    midIds.set(key, await createNode(catMid, {name, kind:'entry'}));

  for(const [key, , ends] of all){
    const from = midIds.get(key);
    for(const e of ends) if(endIds.has(e)) await repo.addLink(from, endIds.get(e));
  }

  for(const [name, mids] of OPEN){
    const id = await createNode(catOpen, {name, kind:'entry'});
    for(const m of mids) if(midIds.has(m)) await repo.addLink(id, midIds.get(m));
  }
}

['Французская защита, вариант Винавера','rnbqk1nr/pp3ppp/4p3/2ppP3/3P4/P1P5/2P2PPP/R1BQKBNR b KQkq - 0 6','Чёрные отдают пару слонов, чтобы испортить белым пешки на ферзевом фланге. У белых сильный центр и атака на короля, у чёрных ясная цель — сдвоенные пешки c3 и c4.'],
['Французская защита, вариант Тарраша','rnbqkbnr/pp3ppp/8/2pp4/3P4/8/PPPN1PPP/R1BQKBNR w KQkq - 0 5','Ход Nd2 избегает связки Bb4. После размена в центре обычно возникает изолированная пешка d5 у чёрных: белые давят на неё, чёрные пользуются свободой фигур.'],
['Французская защита, вариант Рубинштейна','r1bqkbnr/pppn1ppp/4p3/8/3PN3/8/PPP2PPP/R1BQKBNR w KQkq - 1 5','Чёрные снимают напряжение в центре, соглашаясь на чуть худшую, но очень прочную позицию. План — c5 и развитие с разменами; риск минимальный, зато и шансов на перехват немного.'],
['Французская защита, наступление 3.e5','r1bqkbnr/pp3ppp/2n1p3/2ppP3/3P4/2P2N2/PP3PPP/RNBQKB1R b KQkq - 2 5','Белые сразу строят пешечную цепь и захватывают пространство. Вся игра вокруг пункта d4: чёрные бьют по нему пешкой c5, конями с c6 и f5 и ферзём с b6.'],
['Французская защита, разменный вариант','rnbqkb1r/ppp2ppp/5n2/3p4/3P4/3B1N2/PPP2PPP/RNBQK2R b KQkq - 3 5','Симметричная структура с репутацией ничейной, но игра остаётся. Тот, кто первым захватит линию «e» и создаст давление на изолированные поля, получит перевес.'],
['Каро-Канн, классический вариант','r2qkbnr/pp1nppp1/2p3bp/8/3P3P/5NN1/PPP2PP1/R1BQKB1R w KQkq - 2 8','Главное достижение чёрных — белопольный слон выведен за пешечную цепь, чего нет во французской. Белые захватывают пространство на королевском фланге и часто рокируют в длинную сторону.'],
['Каро-Канн, атака Панова','rnbqkb1r/pp3ppp/4pn2/3p4/2PP4/2N5/PP3PPP/R1BQKBNR w KQkq - 0 6','Возникает изолированная пешка d4 у белых со всеми её плюсами: пункт e5, открытые линии, фигурная активность. Чёрные защищаются и стремятся к эндшпилю, где изолятор станет слабостью.'],
['Каро-Канн, наступление 3.e5','rn1qkbnr/pp3ppp/2p1p3/3pPb2/3P4/5N2/PPP2PPP/RNBQKB1R w KQkq - 0 5','Как во французской, но слон успел выйти на f5 — в этом весь смысл каро-канна. Белые пытаются прогнать его ходами Nh4 или g4, чёрные подрывают центр ходом c5.'],
['Каро-Канн, вариант двух коней','rn1qkbnr/pp2pppp/2p5/3p4/4P1b1/2N2N2/PPPP1PPP/R1BQKB1R w KQkq - 2 4','Белые уводят игру от главных линий, не занимая центр пешками. Обычно следует h3 и g4 с попыткой поймать слона в клещи; позиция быстро становится нестандартной.'],
['Каро-Канн, вариант Смыслова','r1bqkbnr/pp1npppp/2p5/8/3PN3/8/PPP2PPP/R1BQKBNR w KQkq - 1 5','Чёрные готовят Ngf6, чтобы не сдваивать пешки после размена на f6. Расстановка прочная и гибкая, но требует аккуратности: конь d7 временно закрывает слона c8.'],
['Каро-Канн, гамбит Фантазия','rnbqkbnr/pp2pppp/2p5/3p4/3PP3/5P2/PPP3PP/RNBQKBNR b KQkq - 0 3','Белые подкрепляют центр пешкой f3, соглашаясь на ослабление диагонали. Позиция острая и малоизученная, часто с ранними жертвами и разносторонними рокировками.'],
['Скандинавская защита','rnb1kb1r/ppp1pppp/5n2/q7/3P4/2N5/PPP2PPP/R1BQKBNR w KQkq - 1 5','Чёрные немедленно вскрывают центр и выводят ферзя, теряя темп после Nc3. Взамен — ясная схема развития с Bf5, e6 и c6, где трудно попасть в теоретическую катастрофу.'],
['Защита Алехина','rnbqkb1r/ppp1pp1p/3p2p1/3nP3/3P4/5N2/PPP2PPP/RNBQKB1R w KQkq - 0 5','Чёрные приглашают белых строить пешечный центр, чтобы потом его расшатать. Ставка провокационная: если центр устоит, чёрным тесно, если рухнет — фигуры белых повиснут.'],
['Защита Пирца-Уфимцева','rnbq1rk1/ppp1ppbp/3p1np1/8/3PP3/2N2N2/PPP1BPPP/R1BQK2R w KQ - 4 6','Гипермодерн: центр отдаётся, слон бьёт по нему с g7. Чёрные готовят подрывы c5 или e5, белые могут выбрать спокойное развитие или австрийскую атаку с f4.'],
['Современная защита (Робач)','rnbqk1nr/1pp1ppbp/p2p2p1/8/3PP3/2N2N2/PPP2PPP/R1BQKB1R w KQkq - 0 5','Ещё гибче, чем пирц: конь g8 пока не выходит, чёрные подстраиваются под соперника. Планы связаны с b5, c5 или e5; главное — не позволить белым построить и удержать полный центр.'],
['Защита Нимцовича 1.e4 Кc6','r1bqkbnr/ppp1pppp/2n5/3P4/4p3/2N5/PPP2PPP/R1BQKBNR b KQkq - 0 4','Редкое начало, где конь занимает поле перед пешкой c. Игра быстро уходит в сторону от известных схем, что и есть главная цель варианта.'],
['Ферзевый гамбит принятый','rnbqkb1r/pp3ppp/4pn2/2p5/2BP4/4PN2/PP3PPP/RNBQK2R w KQkq - 0 6','Чёрные отдают центр, чтобы быстро развиться и подорвать позицию ходом c5. Белые отыгрывают пешку и получают чуть больше пространства; часто возникает изолированная пешка d4.'],
['Ферзевый гамбит, ортодоксальная защита','r1bq1rk1/pppnbppp/4pn2/3p2B1/2PP4/2N1PN2/PP3PPP/R2QKB1R w KQ - 3 7','Классика позиционной игры. Чёрные строят прочный треугольник пешек и ждут возможности разменяться на c4 и провести e5 или c5, белые давят по линии «c» и через связку на f6.'],
['Ферзевый гамбит, разменный вариант','rnbqkb1r/pp3ppp/2p2n2/3p2B1/3P4/2N1P3/PP3PPP/R2QKBNR b KQkq - 0 6','Карлсбадская структура во всей красе. Белые проводят атаку пешечного меньшинства b4-b5, создавая чёрным слабую пешку c6; чёрные ищут контригры в центре или на королевском фланге.'],
['Ферзевый гамбит, защита Тарраша','r1bqkbnr/pp3ppp/2n5/2pp4/3P4/2N2NP1/PP2PP1P/R1BQKB1R b KQkq - 0 6','Чёрные сознательно берут изолированную пешку d5 ради свободной фигурной игры. Белые фианкеттируют слона, чтобы давить на изолятор; спор идёт между активностью и структурой.'],
['Ферзевый гамбит, вариант Кембридж-Спрингс','r1b1kb1r/pp1n1ppp/2p1pn2/q2p2B1/2PP4/2N1PN2/PP3PPP/R2QKB1R w KQkq - 2 7','Ферзь выходит на a5 и создаёт неприятную связку по диагонали a5-e1, часто с ловушкой на c3. Белым приходится тратить время на защиту, а чёрные получают активную игру.'],
['Ферзевый гамбит, защита Ласкера','rnbq1rk1/ppp1bpp1/4p2p/3p4/2PPn2B/2N1PN2/PP3PPP/R2QKB1R w KQ - 2 8','Чёрные упрощают позицию разменами в центре, снимая главную проблему ферзевого гамбита — тесноту. Метод надёжный и до сих пор популярный на высшем уровне.'],
['Славянская защита','rn1qkb1r/pp2pppp/2p2n2/5b2/P1pP4/2N2N2/1P2PPPP/R1BQKB1R w KQkq - 1 6','Пешка c6 поддерживает d5 и не запирает слона c8 — в этом отличие от ортодоксальной защиты. Чёрные берут на c4 и успевают вывести слона до a4; борьба идёт вокруг пунктов b5 и e5.'],
['Полуславянская защита','rnbqkb1r/pp3ppp/2p1pn2/3p4/2PP4/2N2N2/PP2PPPP/R1BQKB1R w KQkq - 0 5','Прочный гибрид славянской и ортодоксальной защиты. Чёрные сохраняют напряжение и в нужный момент играют dxc4 с последующим b5, получая пространство на ферзевом фланге.'],
['Меранский вариант','r1bqkb1r/p2n1ppp/2p1pn2/1p6/2BP4/2N1PN2/PP3PPP/R1BQK2R w KQkq - 0 8','Чёрные захватывают ферзевый фланг пешками b5, a6 и c5, белые вскрывают центр ходами e4 и e5. Один из самых острых позиционных дебютов: обе стороны играют на опережение.'],
['Вариант Ботвинника в полуславянской','rnbqkb1r/p4ppp/2p1pn2/1p4B1/2pPP3/2N2N2/PP3PPP/R2QKB1R w KQkq - 0 7','Материал и структура приносятся в жертву времени. Возникают позиции с проходными на ферзевом фланге у чёрных и мощной инициативой у белых; вариант считается одним из самых сложных в теории.'],
['Каталонское начало','rnbq1rk1/ppp1bppp/4pn2/8/2pP4/5NP1/PP2PPBP/RNBQ1RK1 w - - 0 7','Слон g2 давит по большой диагонали на пункты d5 и b7 — это главный ресурс белых. Чёрные берут пешку c4 и стараются её удержать или вернуть в удобный момент, разменяв слона c8.'],
['Защита Нимцовича','rnbq1rk1/pppp1ppp/4pn2/8/1bPP4/2N1P3/PP3PPP/R1BQKBNR w KQ - 1 5','Слон связывает коня c3 и часто меняется на него, сдваивая белым пешки. Чёрные играют против пешечного центра фигурами, белые рассчитывают на пару слонов и пространство.'],
['Защита Нимцовича, вариант Рубинштейна','rnbq1rk1/pp3ppp/4pn2/2pp4/1bPP4/2NBPN2/PP3PPP/R1BQK2R w KQ - 0 7','Одна из главных линий с типовой структурой изолированной пешки. Белые получают активные фигуры и пункт e5, чёрные — ясную цель для давления и хороший эндшпиль.'],
['Новоиндийская защита','rn1q1rk1/pbppbppp/1p2pn2/8/2PP4/5NP1/PP2PPBP/RNBQ1RK1 w - - 5 7','Оба белопольных слона смотрят по большой диагонали, борьба идёт за поле e4. Позиция гибкая, без слабостей и почти без риска, поэтому дебют популярен, когда чёрных устраивает ничья.'],
['Защита Богоиндийская','rnb1k2r/ppppqppp/4pn2/8/1bPP4/5N2/PP1BPPPP/RN1QKB1R w KQkq - 4 5','Шах слоном на b4 разменивает или оттесняет фигуры без создания слабостей. Игра спокойная, ближе к новоиндийской по духу; чёрные готовят b6 и Bb7 либо d6 и e5.'],
['Староиндийская защита, классический вариант','r1bq1rk1/ppp1npbp/3p1np1/3Pp3/2P1P3/2N2N2/PP2BPPP/R1BQ1RK1 w - - 1 9','Центр закрывается, и начинается гонка на разных флангах: белые идут c5 и вскрывают линию «c», чёрные готовят f5-f4 и штурмуют короля. Кто быстрее — тот и прав.'],
['Староиндийская защита, система Земиша','rnbq1rk1/ppp2pbp/3p1np1/4p3/2PPP3/2N1BP2/PP4PP/R2QKBNR w KQ - 0 7','Ход f3 укрепляет e4 и готовит g4 с рокировкой в длинную сторону. Позиции жёсткие: у белых пространство и атака, у чёрных подрывы c6-b5 и f5 при закрытом центре.'],
['Староиндийская защита, четыре пешки','rnbq1rk1/pp2ppbp/3p1np1/2p5/2PPPP2/2N2N2/PP4PP/R1BQKB1R w KQ - 0 7','Самая амбициозная схема: белые занимают пешками почти весь центр. Огромный пространственный перевес соседствует с риском — если центр дрогнет, слон g7 оживёт мгновенно.'],
['Староиндийская защита, фианкетто','r1bq1rk1/pppnppbp/3p1np1/8/2PP4/2N2NP1/PP2PPBP/R1BQK2R w KQ - 3 7','Белые ставят слона на g2, гася давление по большой диагонали. Игра спокойнее и позиционнее, чем в классической системе; чёрным сложнее организовать типовую атаку на короля.'],
['Защита Грюнфельда, разменный вариант','rnbqk2r/pp2ppbp/6p1/2p5/3PP3/2P2N2/P4PPP/R1BQKB1R w KQkq - 0 8','Белые получают большой пешечный центр, чёрные немедленно его расстреливают ходами c5, Nc6 и Bg4. Классический спор о том, сила центр или мишень.'],
['Защита Грюнфельда, русская система','rnbq1rk1/ppp1ppbp/5np1/8/2QP4/2N2N2/PP2PPPP/R1B1KB1R w KQ - 1 7','Белые отыгрывают пешку ферзём и строят центр без сдвоенных пешек. Чёрные развиваются с темпами, играя a6, b5 и c5 либо Nc6 и Bg4 с давлением на d4.'],
['Волжский гамбит','rn1qkb1r/3ppppp/b4n2/2pP4/8/8/PP2PPPP/RNBQKBNR w KQkq - 0 6','За пешку чёрные получают вечное давление по линиям «a» и «b» и отличного слона g7. Компенсация носит долговременный характер: она не исчезает даже после размена ферзей.'],
['Модерн-Бенони','rnbqkb1r/pp3p1p/3p1np1/2pP4/4P3/2N5/PP3PPP/R1BQKBNR w KQkq - 0 7','Асимметричная структура: у белых пространство и пешечное большинство в центре, у чёрных большинство на ферзевом фланге и слон g7. Игра острая, ничьих мало.'],
['Староиндийская защита, вариант Бенони','rnbq1rk1/pp3pbp/3ppnp1/2pP4/2P1P3/2N2N2/PP2BPPP/R1BQK2R w KQ - 0 8','Гибрид староиндийской и бенони: чёрные бьют по центру пешкой c5, а не e5. Возникает та же гонка на флангах, но с другими подрывами и другой ролью слона g7.'],
['Будапештский гамбит','r1bqkb1r/pppp1ppp/2n5/4P3/2P2Bn1/5N2/PP2PPPP/RN1QKB1R b KQkq - 4 5','Чёрные отдают пешку ради быстрой фигурной игры и давления на пункты e5 и f2. Белым несложно уравнять развитие, но играть надо точно — ловушек в дебюте много.'],
['Контргамбит Альбина','r1bqkbnr/ppp2ppp/2n5/4P3/2Pp4/5N2/PP2PPPP/RNBQKB1R w KQkq - 2 5','Пешка d4 вклинивается в лагерь белых и стесняет фигуры. Расчёт на неудобства соперника: известна ловушка с ходом Bb4+ и превращением пешки в коня.'],
['Защита Чигорина','r2qkbnr/ppp1pppp/2n5/3P4/3P4/5b2/PP2PPPP/RNBQKB1R w KQkq - 0 5','Конь на c6 нарушает все классические каноны, а слоны меняются на коней. Чёрные получают динамичную фигурную игру взамен уступок в структуре и центре.'],
['Голландская защита, ленинградский вариант','rnbq1rk1/ppp1p1bp/3p1np1/5p2/2PP4/5NP1/PP2PPBP/RNBQ1RK1 w - - 0 7','Смесь голландской и староиндийской: слон на g7, пешка на f5. Чёрные играют на атаку королевского фланга ходами e5 и f4, платя за это ослаблением диагонали a2-g8.'],
['Голландская защита, каменная стена','rnbqk2r/pp4pp/2pbpn2/3p1p2/2PP4/5NP1/PP2PPBP/RNBQ1RK1 w kq - 0 7','Пешки c6, d5, e6 и f5 образуют жёсткую стену, конь мечтает о поле e4. Минус известен: слон c8 плохой, а поле e5 достаётся белым.'],
['Голландская защита, классический вариант','rnbq1rk1/ppp1b1pp/3ppn2/5p2/2PP4/5NP1/PP2PPBP/RNBQ1RK1 w - - 0 7','Гибкая расстановка с планом e5. Чёрные сохраняют возможность перейти и к стене, и к более свободным построениям, подстраиваясь под ответы белых.'],
['Английское начало, симметричный вариант','r1bqkb1r/pp2pppp/2n2n2/2pp4/2P5/2N2NP1/PP1PPP1P/R1BQKB1R w KQkq - 0 5','Обе стороны развиваются зеркально, пока кто-то не решится нарушить симметрию. Часто возникают структуры с изолятором или переход в схемы «ежа».'],
['Английское начало, обратная сицилианская','rnbqkb1r/ppp2ppp/1n6/4p3/8/2N3P1/PP1PPPBP/R1BQK1NR w KQkq - 2 6','Сицилианская защита с лишним темпом за белых. Планы знакомые, но роли поменялись: белые давят на ферзевом фланге, чёрные держат центр пешкой e5.'],
['Английское начало, вариант четырёх коней','r1bqk2r/pppp1ppp/2n2n2/4p3/1bP5/2N2NP1/PP1PPP1P/R1BQKB1R w KQkq - 1 5','Естественная расстановка с фианкетто. Игра идёт вокруг пункта d5 и возможного размена на c3, после которого структура определяет дальнейшие планы.'],
['Дебют Рети','rnbq1rk1/ppp1bppp/4pn2/3p4/2P5/5NP1/PP1PPPBP/RNBQ1RK1 w - - 5 6','Белые не занимают центр пешками, а давят на него фигурами. Дебют легко перетекает в каталонское начало, английское или ферзевый гамбит — в этом его главная ценность.'],
['Староиндийское начало','rnbq1rk1/pp2bppp/4pn2/2pp4/4P3/3P1NP1/PPPN1PBP/R1BQ1RK1 b - - 0 7','Староиндийская защита с лишним темпом. Схема универсальна: белые расставляют фигуры по шаблону и готовят e4-e5 с атакой на королевском фланге.'],

/* Проставляет позицию и теорию уже созданным дебютам, находя их по названию. */
async function fillOpeningTheory(){
  await reindex();
  const byName = new Map();
  for(const n of index.all)
    if(n.kind === 'entry' && !byName.has(n.name)) byName.set(n.name, n);

  let done = 0, missed = 0;
  for(const [name, fen, note] of OPEN_INFO){
    const node = byName.get(name);
    if(!node){ missed++; continue; }
    await repo.update(node.id, {fen, note});
    done++;
  }
  return {done, missed};
}

/* Раскладывает сицилианские дебюты по ключевым линиям: каждая линия —
   вложенная запись со своей позицией и пояснением. */
async function fillSicilianLines(){
  await reindex();
  const byName = new Map();
  for(const n of index.all)
    if(n.kind === 'entry' && !byName.has(n.name)) byName.set(n.name, n);

  let added = 0, missed = 0;
  for(const [parent, lines] of SIC_LINES){
    const node = byName.get(parent);
    if(!node){ missed++; continue; }
    const have = new Set(index.all.filter(n => n.parent_id === node.id).map(n => n.name));
    for(const [name, fen, note] of lines){
      if(have.has(name)) continue;
      await createNode(node.id, {name, kind:'entry', fen, note});
      added++;
    }
  }
  return {added, missed};
}
