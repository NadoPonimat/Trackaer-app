name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 сломан (пакет 'tools' удалён Google),
      # поэтому ставим SDK напрямую через предустановленный sdkmanager.
      - name: Set up Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          echo "sdkmanager: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      # Gradle ставится напрямую — gradlew из репозитория не используется
      # (при загрузке через веб-интерфейс GitHub он часто теряет право запуска).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            app/build/outputs/apk/release/app-release.apk \
            --title "Trackaer 2.0.0" \
            --notes "Нативная версия (Kotlin + Jetpack Compose): 18 курсов, 841 урок, быстрая работа офлайн. Анимация входа настраивается в Настройках." \
            --latest
